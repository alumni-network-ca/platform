version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the Node runtime we deploy on (22.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (e.g. the 7.x native compiler) need a deliberate evaluation.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [type:chore, area:ci]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [type:chore, area:ci]

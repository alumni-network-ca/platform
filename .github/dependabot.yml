version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (Next, ESLint, TypeScript, @types/node which tracks our Node 22 runtime, ...)
      # are done deliberately in their own issue, with tests. Security updates still arrive regardless.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages break on "minor" bumps; FND-01 (#87) upgrades @supabase/ssr together with Next.
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-minor"]
    labels: [type:chore, area:ci]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [type:chore, area:ci]

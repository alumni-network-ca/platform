name: Bug report
description: Something is broken or behaves differently than agreed.
labels: ["type:bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: S1 = outage or data exposure · S2 = a core workflow is blocked · S3 = degraded, with a workaround · S4 = cosmetic
      options: [S1, S2, S3, S4]
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution / environment
      placeholder: e.g. herzliah · production
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not paste personal data, passwords or links containing tokens.
      placeholder: |
        1. Sign in as an alumnus
        2. Open Directory, filter by …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen? (date, time, timezone)

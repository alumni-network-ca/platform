# School posts: news and fundraising (EPIC-POST). Outside the launch baseline.
# Design: docs/design/school-posts.md and screens A7.1–A7.4 (school admin), 3.5–3.6 (alumni) in docs/design/alumni-full-flow/.
defaults:
  milestone: FUT
  epic: EPIC-POST
  assignee: Gderhy
  track: Tech
  labels: [type:feature, area:posts, P2]

items:
  - key: POST-01
    title: "School posts data model: news and fundraising, with outbound click log"
    labels: [area:db]
    size: M
    depends: [FND-11]
    related: [FUT-10]
    class: Build
    summary: |
      - **`school_posts`**, one table scoped to the school: `institution_id`, `kind` (`news` | `fundraising`), `title`,
        `body` (sanitized rich text, news), `description` (plain text, fundraising), `external_url`, `goal_note`,
        `ends_on`, `cover_path`, `status` (`draft` | `scheduled` | `published` | `archived`), `publish_at`,
        `published_at`, `created_by`, `updated_at`.
      - **Constraint:** `kind <> 'fundraising' or (external_url is not null and external_url ~ '^https://')`. A
        fundraising post can't exist without an https link, whatever the client sends.
      - **Read:** members of the school see rows where `status = 'published' and publish_at <= now()`. Holders of a new
        `posts.manage` permission (school owner and admin; not reviewer) see every row of their school.
      - **Write:** no insert/update/delete policies. `save_post`, `publish_post` (now or at a time), `unpublish_post`,
        `archive_post` are security-definer RPCs that check `has_permission(inst, 'posts.manage')` and `log_audit`
        (pattern: `20261118000100_school_features.sql`).
      - **Click log:** `post_link_clicks` (`post_id`, `institution_id`, `profile_id`, `created_at`) written only by
        `record_post_click(post_id)`, which checks the caller is a member and the post is a published fundraising post,
        and returns the `external_url`. One row per alumnus, post and day (dedupe index, like `contact_events`).
        **No read policy for school staff**: only platform admins can read it. Showing counts to schools is POST-07.
      - **Covers:** first storage bucket (`post-covers`), tenant-scoped paths, image type and size limits. No storage
        exists yet; reuse the decisions for FUT-10.
    ac:
      - A fundraising row with an http, javascript or empty link is rejected by the database.
      - An alumnus never sees a draft, scheduled or archived post, or another school's post.
      - A reviewer can read published posts but can't write.
      - A school admin can't read `post_link_clicks`.
    tests:
      - "pgTAP: the https constraint, read policies per role and status, cross-tenant isolation, RPC permission checks, click dedupe and the staff read denial."

  - key: POST-02
    title: "Admin: School posts section (News editor, Fundraising form, draft, schedule, preview)"
    labels: [area:admin]
    size: L
    depends: [POST-01]
    class: Build
    summary: |
      Screens A7.1–A7.4. One "Posts" entry in the admin sidebar (`src/lib/admin/sections.ts`, behind `posts.manage`).
      - **List** (`/admin/posts`): All · News · Fundraising tabs, status chips (Draft, Scheduled, Published, Archived),
        and "New post", which asks News or Fundraising first.
      - **News** (`/admin/posts/new?kind=news`, `/admin/posts/[id]`): title, cover image, rich-text body (headings,
        bold, italic, lists, links, quotes; no raw HTML). Pick the editor in the PR (Tiptap is the likely choice); the
        stored HTML is sanitized on the server with an allow-list.
      - **Fundraising** (`?kind=fundraising`): title, description (500 characters), donation link (https only, checked
        in the form and by the database), goal note (optional free text such as "$50,000 for the new library"), end
        date (optional; the post shows "Ended" after it), cover image.
      - **Both:** Save draft, Schedule (date and time, school time zone), Publish now, Preview as alumni see it.
    ac:
      - A reviewer doesn't see the Posts entry and gets a 404 on the routes.
      - An http link shows an inline error before submit.
      - A scheduled post appears for alumni at its time without anyone opening the admin.
    tests:
      - "E2E: create, schedule, publish and unpublish one post of each kind. Unit: the HTML sanitizer and the https check."

  - key: POST-03
    title: "Alumni: School posts page with filter and outbound fundraising button"
    labels: [area:ui]
    size: M
    depends: [POST-01]
    class: Build
    summary: |
      Screens 3.5–3.6. `/posts` lists published posts, newest first, with an All · News · Fundraising filter (only the
      kinds that have posts). `/posts/[id]` shows a news article in full.
      - **Fundraising card:** cover, title, description, goal note, end date, the note "You will leave
        {school}'s alumni network. Donations are handled by {school} on its own site." and a "Give on {host}" button.
        The button calls `record_post_click` and then opens the link in a new tab (`rel="noopener noreferrer"`).
      - **Hidden when empty:** if the school has no published posts, the "Posts" link is left out of the nav bar
        (`src/lib/auth/nav.ts`) and `/posts` returns 404.
    ac:
      - The outbound button always shows the destination host before the click.
      - A click is recorded once per alumnus, post and day; a failed record never blocks the redirect.
    tests:
      - "E2E: filter, fundraising outbound click (row recorded, new tab), nav entry hidden for a school with no posts."

  - key: POST-04
    title: "Optional \"notify alumni\" email when a post is published"
    labels: [area:email]
    size: M
    depends: [POST-02, EML-01, EML-03]
    related: [FUT-13, LEGAL-05]
    class: Build
    summary: |
      A "Notify alumni by email" checkbox on publish (off by default). It queues one `post_published` email per active
      alumnus through the outbox (ADR 0007), skips suppressed addresses, and links to the post. A new
      `email_template_key` value with EN/FR defaults; the school can edit it in Email templates. Sent once per post,
      even if it's unpublished and published again. CASL wording is checked under LEGAL-05.
    ac:
      - Notifying is never automatic and never sent twice for one post.
    tests:
      - "Integration: the outbox rows, suppression and the single-send guard."

  - key: POST-05
    title: "School posts tests: both kinds, end to end"
    labels: [type:test]
    size: S
    depends: [POST-02, POST-03]
    summary: |
      Acceptance evidence for the epic: a two-school isolation run, one news and one fundraising post through draft,
      schedule, publish, filter, outbound click and unpublish, in EN and FR, desktop and mobile.

  - key: POST-06
    title: "Legal wording for fundraising posts"
    labels: [type:legal, needs-noah]
    assignee: castielnoah-art
    track: Legal
    size: S
    related: [LEGAL-02]
    summary: |
      Check the "you will leave this site" note, the button label and the terms: the platform hosts no donation and
      handles no money, the school is responsible for its campaign and receipts, and outbound clicks are recorded.
      Click recording was decided by Gab on 2026-11-24 (record, don't show yet); the privacy policy should mention it.
    ac:
      - Approved EN/FR wording for the note, the button and the privacy policy line.

  - key: POST-07
    title: "Show fundraising click counts to school admins"
    labels: [area:admin, needs-noah]
    size: S
    depends: [POST-01, POST-06]
    summary: |
      Later. A clicks column on the A7.1 list (aggregate counts only, never who clicked), once Noah agrees schools
      should see it. Until then `post_link_clicks` has no school-staff read.

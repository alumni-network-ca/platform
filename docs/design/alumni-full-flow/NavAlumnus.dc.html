<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nav — alumnus</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 640px; background: #f7f7f6; font-family: Inter, Arial, sans-serif; color: #0b2159; display: flex; flex-direction: column">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 760px; margin-top: 12px">
      <div style="height: 150px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e5ee"></div>
      <div style="height: 150px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e5ee"></div>
      <div style="height: 150px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e5ee"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

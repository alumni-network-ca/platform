<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter your code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7b1e3d}a:hover{color:#611630}
input,select,textarea,button{font:inherit}
input:focus{outline:2px solid #7b1e3d;outline-offset:1px}
</style>
</helmet>
<div style="min-height: 900px; background: #f7f7f6; font-family: Inter, Arial, sans-serif; color: #0b2159; display: flex; flex-direction: column">
  <dc-import name="NavBar" role="guest" open="{{ false }}" hint-size="100%,66px"></dc-import>
  <main style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 96px 24px">
    <section style="width: 100%; max-width: 460px; background: #ffffff; border: 1px solid #e2e5ee; border-radius: 12px; padding: 40px 36px; box-sizing: border-box; box-shadow: 0 20px 50px -28px rgba(11,33,89,0.32); display: flex; flex-direction: column; gap: 24px">
      <div style="display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: #faeef3">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7b1e3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800">Check your email</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3a4a70">We sent a 6-digit code to <strong style="color: #0b2159">dana.levy@gmail.com</strong>. It expires in 10 minutes.</p>
      </div>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 13px; font-weight: 600; margin-bottom: 10px">Sign-in code</legend>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
          <input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #8a93ab; border-radius: 8px; color: #0b2159; background: #ffffff">
          <input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #8a93ab; border-radius: 8px; color: #0b2159; background: #ffffff">
          <input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #8a93ab; border-radius: 8px; color: #0b2159; background: #ffffff">
          <input aria-label="Digit 4" inputmode="numeric" maxlength="1" value="9" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 2px solid #7b1e3d; border-radius: 8px; color: #0b2159; background: #ffffff">
          <input aria-label="Digit 5" inputmode="numeric" maxlength="1" value="" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #8a93ab; border-radius: 8px; color: #0b2159; background: #ffffff">
          <input aria-label="Digit 6" inputmode="numeric" maxlength="1" value="" style="width: 100%; box-sizing: border-box; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #8a93ab; border-radius: 8px; color: #0b2159; background: #ffffff">
        </div>
        <span style="font-size: 12px; color: #4a5575">Paste the whole code — we'll fill the boxes.</span>
      </fieldset>
      <a href="Request.dc.html" style="display: flex; justify-content: center; padding: 14px 18px; border-radius: 7px; background: #7b1e3d; color: #ffffff; font-weight: 700; font-size: 15px; text-decoration: none">Verify and continue</a>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 14px">
        <span style="color: #4a5575">Resend code in 0:42</span>
        <a href="Join.dc.html" style="font-weight: 600">Use a different email</a>
      </div>
      <div style="padding: 12px 14px; border-radius: 8px; background: #f2f4f8; font-size: 13px; line-height: 1.5; color: #3a4a70">Prefer a password? You can set one later in your account settings.</div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
